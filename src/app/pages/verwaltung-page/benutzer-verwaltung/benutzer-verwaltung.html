<!-- pur-office/src/app/pages/verwaltung-page/benutzer-verwaltung/benutzer-verwaltung.html -->

<section class="pur-page-section">
  <header class="pur-page-section__header">
    <h2 class="pur-page-section__title">Benutzer verwalten</h2>
  </header>

  <!-- Benutzerauswahl -->
  <div class="pur-form pur-form--grid">
    <div class="pur-form__row">
      <mat-form-field appearance="outline" class="pur-form__field">
        <mat-label>Benutzer</mat-label>
        <mat-select [formControl]="benutzerUid">
          <mat-option disabled>Keine Benutzerprofile geladen</mat-option>
        </mat-select>
      </mat-form-field>

      <button matButton="outlined" type="button" [disabled]="!benutzerUid.value">
        <mat-icon aria-hidden="true">edit</mat-icon>
        Benutzer bearbeiten
      </button>
    </div>

    <p class="pur-form__message" role="status">
      Die Benutzerprofile werden im nächsten Schritt angebunden.
    </p>
  </div>
</section>
