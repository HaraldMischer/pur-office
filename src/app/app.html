<!-- pur-office/src/app/app.html -->

<mat-sidenav-container class="app-shell">
  <mat-sidenav
    class="app-sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    aria-label="Hauptnavigation"
  >
    <!-- app-sidenav -->
    <app-sidenav [isHandset]="isHandset()" (navigationSelected)="closeSidenav()" />
  </mat-sidenav>

  <mat-sidenav-content class="app-content">
    <!-- app-toolbar -->
    <app-toolbar
      [sidenavOpened]="isSidenavOpened"
      [isAuthenticated]="benutzerStore.isAuthenticated()"
      [isLoggedIn]="benutzerStore.isLoggedIn()"
      [inProgress]="benutzerStore.inProgress()"
      (navigationToggle)="toggleSidenav()"
    />

    <main class="app-main">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
