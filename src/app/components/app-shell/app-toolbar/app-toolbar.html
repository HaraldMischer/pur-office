<!-- pur-office/src/app/components/app-shell/app-toolbar/app-toolbar.html -->

<mat-toolbar class="app-toolbar">
  <!-- Navigation und Titel -->
  @if (navigationVisible()) {
    <button
      matIconButton
      type="button"
      aria-label="Hauptnavigation umschalten"
      (click)="navigationToggle.emit()"
    >
      <mat-icon aria-hidden="true">{{ sidenavOpened() ? 'arrow_back_ios' : 'menu' }}</mat-icon>
    </button>
  }

  @if (brandVisible()) {
    <mat-icon class="app-toolbar__brand-icon" aria-hidden="true">business</mat-icon>
  }

  <span class="app-toolbar__title" [class.app-toolbar__title--brand]="brandVisible()">
    {{ title() }}
  </span>
  <span class="app-toolbar__spacer" aria-hidden="true"></span>

  <!-- Theme -->
  <button matIconButton type="button" aria-label="Theme umschalten" (click)="toggleThemeMode()">
    <mat-icon aria-hidden="true">{{ themeIcon() }}</mat-icon>
  </button>

  <!-- Kontoaktionen -->
  @if (isAuthenticated()) {
    <a matIconButton aria-label="Passwort ändern" routerLink="/passwort">
      <mat-icon aria-hidden="true">password</mat-icon>
    </a>

    <button
      matIconButton
      type="button"
      aria-label="Abmelden"
      [disabled]="inProgress()"
      (click)="logout()"
    >
      <mat-icon aria-hidden="true">logout</mat-icon>
    </button>
  }
</mat-toolbar>
