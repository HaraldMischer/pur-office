<!-- pur-office/src/app/components/app-shell/app-toolbar/app-toolbar.html -->

<mat-toolbar class="app-toolbar">
  <!-- Navigation und Titel -->
  @if (navigationVisible()) {
    <button
      matIconButton
      type="button"
      aria-label="Hauptnavigation umschalten"
      (click)="navigationToggle.emit()"
    >
      <mat-icon aria-hidden="true">{{ sidenavOpened() ? 'arrow_back_ios' : 'menu' }}</mat-icon>
    </button>
  }

  @if (brandVisible()) {
    <mat-icon class="app-toolbar__brand-icon" aria-hidden="true">business</mat-icon>
  }

  <span class="app-toolbar__title" [class.app-toolbar__title--brand]="brandVisible()">
    {{ title() }}
  </span>
  <span class="app-toolbar__spacer" aria-hidden="true"></span>

  <!-- Entwicklungshilfen -->
  @if (isDevelopmentMode && isAuthenticated()) {
    <button
      matIconButton
      type="button"
      aria-label="Store-Snapshots protokollieren"
      (click)="logStoreSnapshots()"
    >
      <mat-icon aria-hidden="true">bug_report</mat-icon>
    </button>
  }

  <!-- Theme -->
  <button matIconButton type="button" aria-label="Theme umschalten" (click)="toggleThemeMode()">
    <mat-icon aria-hidden="true">{{ themeIcon() }}</mat-icon>
  </button>

  <!-- Kontomenü -->
  @if (isAuthenticated()) {
    <button
      matIconButton
      type="button"
      aria-label="Kontomenü öffnen"
      [matMenuTriggerFor]="kontoMenu"
    >
      <mat-icon aria-hidden="true">more_vert</mat-icon>
    </button>
    <mat-menu #kontoMenu="matMenu">
      <a mat-menu-item routerLink="/passwort">
        <mat-icon aria-hidden="true">password</mat-icon>
        <span>Passwort ändern</span>
      </a>
      <button mat-menu-item type="button" [disabled]="inProgress()" (click)="logout()">
        <mat-icon aria-hidden="true">logout</mat-icon>
        <span>Abmelden</span>
      </button>
    </mat-menu>
  }

  <!-- Globaler Ladeindikator -->
  @if (isLoading()) {
    <mat-progress-bar
      class="app-toolbar__progress"
      mode="indeterminate"
      aria-label="Daten werden geladen"
    />
  }
</mat-toolbar>
