<!-- pur-office/src/app/components/app-shell/app-sidenav/app-sidenav.html -->

<div class="app-sidenav__content">
  <mat-toolbar class="app-brand-toolbar">
    <mat-icon aria-hidden="true">business</mat-icon>
    <span>{{ title() }}</span>
  </mat-toolbar>

  <mat-nav-list aria-label="Hauptnavigation">
    @for (item of navigationItems(); track item.route) {
      <a
        mat-list-item
        [routerLink]="item.route"
        routerLinkActive="active-nav-item"
        [routerLinkActiveOptions]="{ exact: item.route === '/' }"
        (click)="closeOnHandset()"
      >
        <mat-icon matListItemIcon aria-hidden="true">{{ item.icon }}</mat-icon>
        <span matListItemTitle>{{ item.label }}</span>
      </a>
    }
  </mat-nav-list>
</div>
